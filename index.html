<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Stream Mini App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="dark-theme">
    <!-- Channel Join Overlay -->
    <div id="join-channel-overlay" class="overlay hidden">
        <div class="overlay-content">
            <i class="fab fa-telegram-plane"></i>
            <h2>Join Our Channel</h2>
            <p>Please join our Telegram channel to access all videos.</p>
            <a href="#" id="tg-channel-link" target="_blank" class="btn primary">Join Channel</a>
            <button id="check-join-btn" class="btn secondary">I've Joined</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <img id="app-logo" src="https://via.placeholder.com/40" alt="Logo">
                <span id="app-name">StreamMini</span>
            </div>
            <div class="user-info">
                <span id="username">Guest</span>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>

        <!-- Navigation Bar (Top) -->
        <nav class="top-nav">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search videos...">
            </div>
        </nav>

        <!-- Page Content -->
        <main id="main-content">
            <!-- Home Page -->
            <section id="home-page" class="page">
                <!-- Top Ad -->
                <div class="ad-container inline-ad" id="top-ad"></div>

                <!-- Categories -->
                <div class="categories-scroll">
                    <div class="category active" data-category="all">All</div>
                    <!-- Categories will be injected here -->
                </div>

                <!-- Sections -->
                <div class="video-section" id="trending-section">
                    <h3><i class="fas fa-fire"></i> Trending</h3>
                    <div class="video-grid horizontal" id="trending-grid"></div>
                </div>

                <div class="video-section" id="latest-section">
                    <h3><i class="fas fa-clock"></i> Latest</h3>
                    <div class="video-grid" id="latest-grid"></div>
                </div>

                <div class="video-section" id="most-viewed-section">
                    <h3><i class="fas fa-eye"></i> Most Viewed</h3>
                    <div class="video-grid" id="most-viewed-grid"></div>
                </div>
            </section>

            <!-- Player Page -->
            <section id="player-page" class="page hidden">
                <div class="back-btn" onclick="app.goBack()">
                    <i class="fas fa-arrow-left"></i> Back
                </div>
                
                <div class="player-container">
                    <div id="video-wrapper">
                        <!-- Ad before play -->
                        <div id="play-ad-overlay" class="play-ad hidden">
                            <div class="ad-timer">Ad: <span id="ad-countdown">5</span>s</div>
                            <div id="play-ad-content"></div>
                        </div>
                        <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>

                <div class="video-info">
                    <h2 id="player-title">Video Title</h2>
                    <div class="video-meta">
                        <span id="player-views"><i class="fas fa-eye"></i> 0 views</span>
                        <span id="player-date"><i class="fas fa-calendar"></i> 2 days ago</span>
                    </div>
                    
                    <div class="action-buttons">
                        <button id="favorite-btn" class="btn-icon"><i class="far fa-heart"></i> Favorite</button>
                        <button id="download-btn" class="btn-icon"><i class="fas fa-download"></i> Download</button>
                    </div>

                    <div class="tags-container" id="player-tags"></div>
                    
                    <div class="description-box">
                        <p id="player-description">Description goes here...</p>
                    </div>

                    <!-- Overlay Ad -->
                    <div class="ad-container overlay-ad" id="player-overlay-ad"></div>

                    <div class="comments-section">
                        <h3>Comments</h3>
                        <div class="comment-input">
                            <input type="text" id="new-comment" placeholder="Add a comment...">
                            <button id="post-comment"><i class="fas fa-paper-plane"></i></button>
                        </div>
                        <div id="comments-list"></div>
                    </div>

                    <div class="related-section">
                        <h3>Related Videos</h3>
                        <div class="video-grid" id="related-grid"></div>
                    </div>
                </div>
            </section>

            <!-- Favorites Page -->
            <section id="favorites-page" class="page hidden">
                <h3>My Favorites</h3>
                <div class="video-grid" id="favorites-grid"></div>
            </section>

            <!-- History Page -->
            <section id="history-page" class="page hidden">
                <h3>Watch History</h3>
                <div class="video-grid" id="history-grid"></div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-page="home-page">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" data-page="favorites-page">
                <i class="fas fa-heart"></i>
                <span>Favorites</span>
            </div>
            <div class="nav-item" data-page="history-page">
                <i class="fas fa-history"></i>
                <span>History</span>
            </div>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
